<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecdf2"/>
      <stop offset="0.6" stop-color="#c9e8fa"/>
      <stop offset="1" stop-color="#eaf6fd"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e02020"/>
      <stop offset="1" stop-color="#9c0f0f"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a2b"/>
      <stop offset="1" stop-color="#5d3a18"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect y="0" width="4" height="1" fill="#000000" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="640" height="360" fill="url(#sky)"/>

  <!-- Radiating glory beams -->
  <g opacity="0.5">
    <path d="M320 150 L 120 -60 L 220 -80 Z" fill="#ffe9f2"/>
    <path d="M320 150 L 300 -90 L 390 -90 Z" fill="#ffd6e6"/>
    <path d="M320 150 L 480 -80 L 570 -50 Z" fill="#ffe9f2"/>
    <path d="M320 150 L 700 20 L 700 110 Z" fill="#ffd6e6"/>
    <path d="M320 150 L -60 20 L -60 110 Z" fill="#ffd6e6"/>
    <path d="M320 150 L 700 190 L 700 260 Z" fill="#ffe9f2"/>
    <path d="M320 150 L -60 190 L -60 260 Z" fill="#ffe9f2"/>
  </g>

  <!-- Rising red sun -->
  <circle cx="320" cy="185" r="55" fill="#e02020" opacity="0.9"/>
  <circle cx="320" cy="185" r="66" fill="none" stroke="#e02020" stroke-width="3" opacity="0.35"/>

  <!-- Sacred mountain range -->
  <path d="M0 235 L 90 168 L 150 210 L 232 138 L 320 225 L 0 260 Z" fill="#4a6f96"/>
  <path d="M232 138 L 208 165 L 232 158 L 252 172 L 264 160 Z" fill="#ffffff"/>
  <path d="M320 235 L 420 155 L 470 200 L 560 150 L 640 230 L 640 260 L 320 260 Z" fill="#3d5f84"/>
  <path d="M420 155 L 402 178 L 422 170 L 438 182 L 448 176 Z" fill="#ffffff"/>
  <path d="M560 150 L 545 170 L 562 164 L 576 174 L 585 168 Z" fill="#ffffff"/>
  <!-- Lake -->
  <rect x="0" y="248" width="640" height="24" fill="#6fa5cf" opacity="0.8"/>

  <!-- Fireworks -->
  <g stroke="#f5b93c" stroke-width="2.5" stroke-linecap="round" opacity="0.95">
    <g transform="translate(96,70)">
      <line x1="0" y1="0" x2="0" y2="-24"/><line x1="0" y1="0" x2="17" y2="-17"/>
      <line x1="0" y1="0" x2="24" y2="0"/><line x1="0" y1="0" x2="17" y2="17"/>
      <line x1="0" y1="0" x2="0" y2="24"/><line x1="0" y1="0" x2="-17" y2="17"/>
      <line x1="0" y1="0" x2="-24" y2="0"/><line x1="0" y1="0" x2="-17" y2="-17"/>
    </g>
    <g transform="translate(556,60)" stroke="#e05a5a">
      <line x1="0" y1="0" x2="0" y2="-22"/><line x1="0" y1="0" x2="15" y2="-15"/>
      <line x1="0" y1="0" x2="22" y2="0"/><line x1="0" y1="0" x2="15" y2="15"/>
      <line x1="0" y1="0" x2="0" y2="22"/><line x1="0" y1="0" x2="-15" y2="15"/>
      <line x1="0" y1="0" x2="-22" y2="0"/><line x1="0" y1="0" x2="-15" y2="-15"/>
    </g>
    <circle cx="96" cy="70" r="3.5" fill="#fff2b0" stroke="none"/>
    <circle cx="556" cy="60" r="3.5" fill="#ffd9d9" stroke="none"/>
  </g>

  <!-- ============ ANCHOR ============ -->
  <!-- Hanbok skirt (chima) -->
  <path d="M320 196 C 250 210 222 268 214 300 L 426 300 C 418 268 390 210 320 196 Z" fill="#e0407f"/>
  <path d="M320 196 C 285 204 262 232 252 262 L 388 262 C 378 232 355 204 320 196 Z" fill="#ea6a9d"/>
  <!-- Jeogori (jacket) highlight -->
  <path d="M320 190 C 292 196 276 214 268 234 L 372 234 C 364 214 348 196 320 190 Z" fill="#f48ab5"/>
  <!-- Collar (git) -->
  <path d="M320 192 L 300 226 L 310 230 L 320 206 L 330 230 L 340 226 Z" fill="#ffffff"/>
  <path d="M320 194 L 303 224 L 308 226 L 320 202 L 332 226 L 337 224 Z" fill="#c2185b"/>
  <!-- Ribbon (otgoreum) -->
  <path d="M316 226 C 312 246 310 262 312 276 L 322 276 C 320 260 322 244 324 226 Z" fill="#b01050"/>
  <circle cx="320" cy="226" r="7" fill="#b01050"/>
  <!-- Raised proclaiming arm with pages -->
  <path d="M382 236 C 402 216 416 196 420 178 C 432 184 438 194 438 204 C 430 224 412 244 396 254 Z" fill="#e0407f"/>
  <rect x="418" y="150" width="34" height="42" rx="3" fill="#ffffff" transform="rotate(12 435 171)"/>
  <rect x="418" y="150" width="34" height="42" rx="3" fill="none" stroke="#cfcfcf" stroke-width="1.5" transform="rotate(12 435 171)"/>
  <path d="M428 178 C 434 170 444 168 452 172 C 452 182 446 190 436 192 C 430 188 427 183 428 178 Z" fill="#f2c39a"/>
  <!-- Left arm resting -->
  <path d="M262 240 C 250 254 244 268 242 282 L 262 288 C 266 272 272 258 280 246 Z" fill="#e0407f"/>
  <!-- Neck & face -->
  <rect x="308" y="158" width="24" height="24" fill="#efbd94"/>
  <circle cx="320" cy="136" r="34" fill="#f6d3ae"/>
  <!-- Ears -->
  <circle cx="288" cy="138" r="6" fill="#efbd94"/>
  <circle cx="352" cy="138" r="6" fill="#efbd94"/>
  <!-- Signature bouffant -->
  <path d="M287 132 C 279 84 361 84 353 132 C 364 122 369 96 353 78 C 372 84 372 66 352 62 C 344 48 296 48 288 62 C 268 66 268 84 287 78 C 271 96 276 122 287 132 Z" fill="#160f06"/>
  <path d="M289 134 C 284 116 288 100 298 90 C 291 106 291 122 294 136 Z" fill="#160f06"/>
  <path d="M351 134 C 356 116 352 100 342 90 C 349 106 349 122 346 136 Z" fill="#160f06"/>
  <!-- Determined brows -->
  <path d="M298 122 L 314 118" stroke="#160f06" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M342 122 L 326 118" stroke="#160f06" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Eyes -->
  <path d="M301 130 q 6 -6 13 0" stroke="#160f06" stroke-width="2.6" fill="none"/>
  <path d="M326 130 q 6 -6 13 0" stroke="#160f06" stroke-width="2.6" fill="none"/>
  <circle cx="307.5" cy="129" r="2.4" fill="#160f06"/>
  <circle cx="332.5" cy="129" r="2.4" fill="#160f06"/>
  <!-- Nose -->
  <path d="M320 132 L 318 142 L 323 142" stroke="#d9a377" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Impassioned open mouth -->
  <path d="M308 150 Q 320 144 332 150 Q 330 162 320 162 Q 310 162 308 150 Z" fill="#8e1f2c"/>
  <path d="M311 149.5 Q 320 146 329 149.5 L 328 152 Q 320 149 312 152 Z" fill="#ffffff"/>
  <!-- Blush -->
  <ellipse cx="298" cy="142" rx="6" ry="4" fill="#f0a3b0" opacity="0.65"/>
  <ellipse cx="342" cy="142" rx="6" ry="4" fill="#f0a3b0" opacity="0.65"/>

  <!-- Desk -->
  <rect x="120" y="288" width="400" height="72" fill="url(#desk)"/>
  <rect x="112" y="280" width="416" height="14" rx="4" fill="#a06a33"/>
  <!-- Desk emblem -->
  <circle cx="320" cy="326" r="17" fill="#c8102e"/>
  <path d="M320 314 l3.4 7 7.8 1.1 -5.6 5.4 1.3 7.7 -6.9 -3.6 -6.9 3.6 1.3 -7.7 -5.6 -5.4 7.8 -1.1 Z" fill="#ffd700"/>
  <!-- Microphone -->
  <rect x="188" y="252" width="8" height="32" fill="#2b2b2b" transform="rotate(-8 192 268)"/>
  <ellipse cx="187" cy="248" rx="12" ry="13" fill="#3a3a3a"/>
  <ellipse cx="187" cy="248" rx="12" ry="13" fill="none" stroke="#191919" stroke-width="3"/>
  <!-- Papers on desk -->
  <rect x="238" y="276" width="52" height="10" rx="2" fill="#ffffff" transform="rotate(-4 264 281)"/>

  <!-- Lower third -->
  <rect x="0" y="306" width="640" height="54" fill="url(#band)"/>
  <rect x="0" y="303" width="640" height="4" fill="#ffd700"/>
  <rect x="14" y="316" width="86" height="34" fill="#ffd700"/>
  <text x="57" y="341" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#9c0f0f" text-anchor="middle">속보</text>
  <text x="116" y="340" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#ffe45c">위대한 커미셔너 만세! GLORIOUS NEWS FOLLOWS</text>

  <!-- Station bug -->
  <g opacity="0.92">
    <path d="M586 22 l4.6 9.4 10.4 1.4 -7.5 7.2 1.8 10.3 -9.3 -4.9 -9.3 4.9 1.8 -10.3 -7.5 -7.2 10.4 -1.4 Z" fill="#c8102e"/>
    <text x="604" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" stroke="#9c0f0f" stroke-width="0.6" text-anchor="middle">LCNA</text>
  </g>

  <!-- Broadcast scanlines -->
  <rect width="640" height="360" fill="url(#scan)"/>
</svg>
