<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <!-- Broadcast background: radiant beams -->
  <rect width="640" height="400" fill="#c8e4f5"/>
  <g opacity="0.55">
    <path d="M320 200 L-100 -80 L60 -120 Z" fill="#f9c9d8"/>
    <path d="M320 200 L220 -140 L400 -140 Z" fill="#f6b0c8"/>
    <path d="M320 200 L580 -120 L740 -80 Z" fill="#f9c9d8"/>
    <path d="M320 200 L760 40 L760 160 Z" fill="#f6b0c8"/>
    <path d="M320 200 L-120 40 L-120 160 Z" fill="#f6b0c8"/>
  </g>
  <!-- Monument skyline -->
  <g fill="#9db8cc">
    <rect x="40" y="150" width="26" height="90"/>
    <polygon points="53,110 40,150 66,150"/>
    <rect x="560" y="160" width="40" height="80"/>
    <rect x="500" y="180" width="30" height="60"/>
  </g>
  <!-- Desk -->
  <rect x="80" y="290" width="480" height="80" rx="6" fill="#7a4a21"/>
  <rect x="80" y="282" width="480" height="14" rx="6" fill="#935c2c"/>
  <!-- Anchor: pink hanbok -->
  <path d="M320 170 C 240 190 210 260 200 300 L 440 300 C 430 260 400 190 320 170 Z" fill="#e83e8c"/>
  <path d="M320 170 C 280 180 258 210 250 240 L 390 240 C 382 210 360 180 320 170 Z" fill="#f06ba8"/>
  <!-- Hanbok bow -->
  <circle cx="320" cy="215" r="10" fill="#c2185b"/>
  <path d="M320 215 L290 250 L305 252 Z" fill="#c2185b"/>
  <path d="M320 215 L350 250 L335 252 Z" fill="#c2185b"/>
  <!-- Neck & face -->
  <rect x="306" y="132" width="28" height="26" fill="#f4c9a3"/>
  <circle cx="320" cy="112" r="38" fill="#f7d6b3"/>
  <!-- Hair: voluminous bouffant -->
  <path d="M282 108 C 276 60 364 60 358 108 C 366 96 370 74 356 60 C 336 40 304 40 284 60 C 270 74 274 96 282 108 Z" fill="#1d1508"/>
  <path d="M283 110 C 279 92 285 76 296 68 C 288 84 287 98 289 112 Z" fill="#1d1508"/>
  <path d="M357 110 C 361 92 355 76 344 68 C 352 84 353 98 351 112 Z" fill="#1d1508"/>
  <!-- Face -->
  <circle cx="306" cy="108" r="4" fill="#2b1d0e"/>
  <circle cx="334" cy="108" r="4" fill="#2b1d0e"/>
  <path d="M300 99 q 6 -5 12 -1" stroke="#2b1d0e" stroke-width="2.5" fill="none"/>
  <path d="M328 98 q 6 -4 12 1" stroke="#2b1d0e" stroke-width="2.5" fill="none"/>
  <path d="M304 128 q 16 14 32 0" stroke="#b02a37" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="296" cy="120" r="5" fill="#f2a6b8" opacity="0.7"/>
  <circle cx="344" cy="120" r="5" fill="#f2a6b8" opacity="0.7"/>
  <!-- Raised proclaiming hand -->
  <path d="M418 232 C 428 210 442 200 452 198 C 448 212 438 228 428 240 Z" fill="#f4c9a3"/>
  <!-- Microphone -->
  <rect x="180" y="256" width="10" height="40" fill="#333"/>
  <circle cx="185" cy="250" r="14" fill="#444"/>
  <circle cx="185" cy="250" r="14" fill="none" stroke="#222" stroke-width="3"/>
  <!-- Desk placard -->
  <rect x="250" y="310" width="140" height="34" rx="4" fill="#b02a37"/>
  <text x="320" y="333" font-family="Times New Roman, serif" font-size="19" font-weight="bold" fill="#ffe9a8" text-anchor="middle">LCNA-TV</text>
  <!-- Red star -->
  <path d="M596 36 l6.5 13.4 14.8 2 -10.7 10.3 2.6 14.6 -13.2 -7 -13.2 7 2.6 -14.6 -10.7 -10.3 14.8 -2 Z" fill="#c8102e"/>
</svg>
